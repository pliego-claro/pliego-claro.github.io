# Pliego Claro · actualiza las fichas de licitaciones TIC cada mañana y publica la web.
# Gratis: GitHub Actions + GitHub Pages en repositorio público.
name: actualizar-y-publicar
on:
  schedule:
    - cron: '30 5 * * *'   # 06:30 hora peninsular (invierno)
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Generar fichas
        env:
          CATEGORIAS_DIR: sitio/licitaciones
          CATEGORIAS_EN_SITEMAP: '1'
        run: |
          if [ -f datos/licitaciones.json ]; then P=12; else P=60; fi
          node scripts/generar.mjs $P
      - name: Guardar datos
        run: |
          git config user.name "brio-ia"
          git config user.email "actions@users.noreply.github.com"
          git add datos sitio
          git diff --cached --quiet || git commit -m "Fichas del $(date +%F)"
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: sitio }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
  avisar-buscadores:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: IndexNow (Bing, Yandex y otros)
        run: |
          git pull --quiet || true
          URLS=$(grep -o '<loc>[^<]*</loc>' sitio/sitemap.xml | sed 's/<[^>]*>//g' | head -9000 | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -s -o /dev/null -w "IndexNow %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"pliego-claro.github.io\",\"key\":\"41ed51a7955a4825ed6ae764e24d5953\",\"keyLocation\":\"https://pliego-claro.github.io/41ed51a7955a4825ed6ae764e24d5953.txt\",\"urlList\":$URLS}"
